<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易叫号系统</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #controller { display: none; } /* 默认隐藏控制器 */
        input, button { font-size: 20px; padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h1>简易叫号系统</h1>
    <p>连接状态: <span id="status">正在连接...</span></p>
    <div>
        <div style="display: flex;justify-content: center;">房间号：<div id="text-room-id"></div></div>
        <input placeholder="请输入房间号" id="roomId" />
        <button onclick="confirm()">确认</button>
    </div>
    <!-- 引入Socket.IO客户端库 -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // 建立与服务器的连接
        const socket = io();
        const textRoomId = document.getElementById('text-room-id');
        const statusElement = document.getElementById('status');
        let localStorageRoomId = localStorage.getItem('roomId');

        if (localStorageRoomId) {
            textRoomId.textContent = localStorageRoomId;
        } else {
            textRoomId.textContent = '-';
        }

        const confirm = () => {
            const roomId = document.getElementById('roomId').value;
            localStorage.setItem('roomId', roomId);
            localStorageRoomId = roomId;
            textRoomId.textContent = roomId;
        };

        // 连接成功
        socket.on('connect', () => {
            statusElement.textContent = '已连接 (' + socket.id + ')';
            statusElement.style.color = 'green';
        });

        // 连接断开
        socket.on('disconnect', () => {
            statusElement.textContent = '连接断开';
            statusElement.style.color = 'red';
        });

        socket.on('playSound', (event) => {
            console.log('localStorageRoomId', localStorageRoomId, event, localStorageRoomId.toString() === event.roomId);
            if (localStorageRoomId.toString() === event.roomId) {
                speakNumber(event.number);
            }
        });

        // 使用Web Speech API朗读文本
        function speakNumber(num) {
            const utterance = new SpeechSynthesisUtterance(num);
            utterance.lang = 'zh-CN'; // 设置中文语音
            utterance.rate = 1.0; // 语速
            speechSynthesis.speak(utterance);
        }

        // navigator
        //     .mediaDevices
        //     .getUserMedia({ video: true, audio: true })
        //     .then((result) => {
        //         socket.emit('videoStreamUpload', { media: result });
        //     });

        const pc = new RTCPeerConnection();

        pc.createOffer().then((offer) => {
            pc.setLocalDescription(offer);
            console.log('offer', offer);
            // 将 offer.sdp 发送给 B（通过信令服务器/手动复制）
            socket.emit('sendWebRTCOffer', { offer });
        });

        socket.on('getWebRTCAnswer', (data) => {
            console.log('web rtc', data);
            pc.setRemoteDescription({ type: 'answer', sdp: data.answer.sdp });
            const channel = pc.createDataChannel("chat");
            channel.onopen = () => {
                channel.onmessage = e => console.log("收到消息:", e.data);
                channel.send('已连接');
            };
        });
    </script>
</body>
</html>
